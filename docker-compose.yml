version: "3.9"

services:
  # MySQL Database Service
  # ===============================================================================
  db:
    image: mysql:8.0
    container_name: mysql-autoguardec
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: CarInsuranceDB
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autoguardec-network

  # Flask Web Application Service
  # ===============================================================================
  web:
    build: .
    container_name: autoguardec-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123
      DB_NAME: CarInsuranceDB
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
    ports:
      - "5000:5000"
    networks:
      - autoguardec-network
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates

# Volumes
# ===============================================================================
volumes:
  mysql_data:
    driver: local

# Networks
# ===============================================================================
networks:
  autoguardec-network:
    driver: bridge
