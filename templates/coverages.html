{% extends 'base.html' %}
{% block title %}Coverages | AutoGuardEC{% endblock %}

{% block content %}
<div class="container-fluid px-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark mb-0"><i class="fas fa-shield-alt"></i> Coverages</h2>
    <button class="btn btn-success px-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#addCoverageModal">
      <i class="fas fa-plus"></i> Add Coverage
    </button>
  </div>

  <!-- Add Coverage Modal -->
  <div class="modal fade" id="addCoverageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-sm">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title"><i class="fas fa-shield-alt"></i> Add Coverage</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="coverageForm" class="row g-3">
            <div class="col-md-12">
              <label class="form-label fw-semibold">Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="col-md-12">
              <label class="form-label fw-semibold">Description</label>
              <textarea class="form-control" id="description" rows="3" required></textarea>
            </div>
            <div class="col-12 text-end mt-3">
              <button type="submit" class="btn btn-primary px-4">
                <i class="fas fa-save"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Coverages Table -->
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-list"></i> Coverage List</h5>
      <button class="btn btn-outline-secondary btn-sm" id="refreshBtn">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>
    <div class="card-body table-responsive">
      <table class="table table-hover align-middle text-center">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="coveragesTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/coverages.js') }}"></script>
{% endblock %}
