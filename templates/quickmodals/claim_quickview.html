<!-- =========================== -->
<!--    CLAIM QUICK VIEW MODAL   -->
<!-- =========================== -->
<div class="modal fade" id="claimQuickViewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <!-- HEADER -->
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          <i class="fas fa-exclamation-triangle"></i> Claim Quick View
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <!-- BODY -->
      <div class="modal-body">

        <!-- Loading Spinner -->
        <div id="claimLoadingSpinner" class="text-center py-4" style="display: none;">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2">Loading claim...</p>
        </div>

        <!-- Dynamic Content -->
        <div id="claimQuickViewContent" style="display: none;">

          <!-- Claim Title -->
          <h4 id="qv_claim_title" class="fw-bold mb-3"></h4>

          <!-- Info Grid -->
          <div class="row g-3">
            <div class="col-md-6">
              <p><strong>ID:</strong> <span id="qv_claim_id"></span></p>
              <p><strong>Status:</strong> <span id="qv_claim_status"></span></p>
              <p><strong>Claim Date:</strong> <span id="qv_claim_date"></span></p>
            </div>

            <div class="col-md-6">
              <p><strong>Policy ID:</strong> <span id="qv_claim_policy"></span></p>
            </div>
          </div>

          <hr>

          <!-- Description -->
          <h5 class="fw-bold mt-3">Description</h5>
          <p id="qv_claim_description" class="small"></p>

          <hr>

          <!-- Claim Payments -->
          <h5 class="fw-bold mt-3">Claim Payments</h5>
          <ul id="qv_claim_payments" class="list-group small"></ul>

        </div>
      </div>

      <!-- FOOTER -->
      <div class="modal-footer">
        <a id="claimFullProfileBtn" href="#" class="btn btn-primary">
          <i class="fas fa-receipt"></i> View Full Claim
        </a>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>
